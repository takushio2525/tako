[package]
name = "tako-cli"
description = "Layer 1 CLI（`tako` コマンド）。IPC サーバーへ JSON-RPC で接続する"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tako"
path = "src/main.rs"

[dependencies]
tako-control.workspace = true
tako-core.workspace = true
clap.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serde = { workspace = true }

# アイコン / バージョン情報リソースの埋め込み（#587。build.rs 参照）。
# cfg(windows) を付けて macOS のビルドグラフに載せない
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
