[package]
name = "tako-cli"
description = "Layer 1 CLI（`tako` コマンド）。IPC サーバーへ JSON-RPC で接続する"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `cargo run -p tako-cli` は `tako` を走らせる（実行ファイルが 2 つあるため明示する。#2021）
default-run = "tako"

# `tako` と MCP の stdio ブリッジ専用の `tako-mcp` が共有する部品（IPC クライアント・ブリッジ本体。#2021）
[lib]
name = "tako_cli"
path = "src/lib.rs"

[[bin]]
name = "tako"
path = "src/main.rs"

# MCP の stdio ブリッジ専用の小さな実行ファイル（#2021）。macOS の .app では `tako mcp serve` が
# これへ exec で引き渡す（登録のコマンドは変わらない）。libSystem だけをリンクする（build.rs）
[[bin]]
name = "tako-mcp"
path = "src/bin/tako-mcp.rs"

[dependencies]
tako-control.workspace = true
tako-core.workspace = true
clap.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serde = { workspace = true }

# アイコン / バージョン情報リソースの埋め込み（#587。build.rs 参照）。
# cfg(windows) を付けて macOS のビルドグラフに載せない
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
