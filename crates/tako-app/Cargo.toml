[package]
name = "tako-app"
description = "GPUI バイナリ（UI 層）。GPUI 依存はこのクレートだけに閉じ込める"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tako-app"
path = "src/main.rs"

[features]
# Metal の描画結果を直接 RGBA へ読み戻す実画面ピクセル検証専用。
# 通常ビルドには test-support を含めない。
visual-test = ["gpui_platform/test-support"]

[dependencies]
tako-core.workspace = true
tako-control.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
# セルフテストでの MCP 応答解釈に使う
serde.workspace = true
serde_json.workspace = true
# プレビューペイン: コードハイライト（FR-3.2）と Markdown パース（FR-3.3）
syntect.workspace = true
two-face.workspace = true
# 構文セットの直列化の鏡（#1917 / #1954 / #1935。syntax_mirror.rs）。syntect の依存と同じ版
bincode.workspace = true
pulldown-cmark.workspace = true
notify.workspace = true
image.workspace = true
# アプリ内更新の GitHub Releases チェック（update_checker）
ureq.workspace = true
# Windows のアプリ内更新でインストーラーを配布元の sha256 と突き合わせる（#2434。
# tako-core / tako-control が既に使っている版なので依存の木は増えない）
sha2.workspace = true
# Web ビューペイン（FR-3.8）: OS ネイティブ webview の GPUI 子ビュー統合
wry.workspace = true
raw-window-handle.workspace = true

# PDF プレビューの Windows 実装（#521。platform/pdf/windows.rs 参照）。
# OS 標準の `Windows.Data.Pdf` を呼ぶだけで、追加の再頒布物は要らない
[target.'cfg(windows)'.dependencies]
windows.workspace = true
# PDF 構造パーサ（#693）。ラスタライズは WinRT、リンク注釈・目次は lopdf で補う
lopdf.workspace = true

# two-face に無い構文（#1954）の YAML をビルド時に構文定義へ読む（build.rs の
# `compile_extra_syntaxes`）。YAML のパーサ（yaml-rust）はビルドスクリプトにだけ入り、
# 配布バイナリへは入らない（起動時は直列化した構文定義を読むだけ）
[build-dependencies]
syntect = { workspace = true, features = ["yaml-load"] }
# 塗りの正規表現の前置き（#1917 / #1935）をビルド時に書き換える（build.rs の
# `generate_prefiltered_syntaxes` = src/syntax_rewrite.rs）。two-face 以外は上の syntect が
# ビルド依存として既に引いている版そのもの（ホスト向けに増えるコンパイルは two-face だけ）
two-face.workspace = true
fancy-regex.workspace = true
regex-syntax.workspace = true
bincode.workspace = true
flate2.workspace = true
serde.workspace = true

# 書き換えの等価性の単体テスト（syntax_rewrite.rs / syntax_prefilter.rs）。
# アプリ本体は書き換えないので、実行時の依存には入れない
[dev-dependencies]
fancy-regex.workspace = true
regex-syntax.workspace = true
flate2.workspace = true

# アイコン / バージョン情報リソースの埋め込み（#587。build.rs 参照）。
# cfg(windows) を付けて macOS のビルドグラフに載せない
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
