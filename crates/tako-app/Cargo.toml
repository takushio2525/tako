[package]
name = "tako-app"
description = "GPUI バイナリ（UI 層）。GPUI 依存はこのクレートだけに閉じ込める"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tako-app"
path = "src/main.rs"

[features]
# Metal の描画結果を直接 RGBA へ読み戻す実画面ピクセル検証専用。
# 通常ビルドには test-support を含めない。
visual-test = ["gpui_platform/test-support"]

[dependencies]
tako-core.workspace = true
tako-control.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
# セルフテストでの MCP 応答解釈に使う
serde.workspace = true
serde_json.workspace = true
# プレビューペイン: コードハイライト（FR-3.2）と Markdown パース（FR-3.3）
syntect.workspace = true
two-face.workspace = true
pulldown-cmark.workspace = true
notify.workspace = true
image.workspace = true
# アプリ内更新の GitHub Releases チェック（update_checker）
ureq.workspace = true
# Web ビューペイン（FR-3.8）: OS ネイティブ webview の GPUI 子ビュー統合
wry.workspace = true
raw-window-handle.workspace = true

# PDF / 動画プレビューの Windows 実装（#521。platform/pdf/windows.rs / platform/video/windows.rs 参照）。
# OS 標準の `Windows.Data.Pdf` と Media Foundation を呼ぶだけで、追加の再頒布物は要らない
[target.'cfg(windows)'.dependencies]
windows.workspace = true
# COM オブジェクトを Rust 側で実装する #[implement] マクロが windows_core をクレート名で
# 参照するため、windows crate 経由ではなく直接の依存として要る（#521 の動画側）
windows-core.workspace = true
# PDF 構造パーサ（#693）。ラスタライズは WinRT、リンク注釈・目次は lopdf で補う
lopdf.workspace = true

# アイコン / バージョン情報リソースの埋め込み（#587。build.rs 参照）。
# cfg(windows) を付けて macOS のビルドグラフに載せない
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
