# CI — macOS / Windows でビルド + lint + テスト
#
# Windows ジョブは Phase 0 残タスク「windows ランナーでの PoC 相当ビルド・スモーク」を兼ねる
# （実機が無いため CI が唯一の Windows 検証手段。.agent/roadmap.md Phase 1）。
# gpui の Windows ビルド前提（Spectre-mitigated libs 等）は .agent/architecture.md を参照。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI ではインクリメンタルビルド不要（キャッシュ効率優先）
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    name: macOS（build + lint + test）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/tako-remote/package-lock.json
            docs/package-lock.json
      # rust_embed が web/tako-remote/dist/ をコンパイル時に埋め込むため、
      # cargo の全ステップ（clippy 含む）より前に PWA をビルドする必要がある。
      # dist/ は .gitignore 対象なのでクリーンチェックアウトには存在しない（Issue #574）。
      # 手順は scripts/build-app.sh の「PWA ビルド」節と同じ
      - name: PWA をビルド（rust_embed が dist/ を要求する）
        working-directory: web/tako-remote
        run: npm ci --no-audit --no-fund && npm run build
      # docs サイトは **Cloudflare Pages がビルドを代行**していたので、CI では
      # 1 度も astro build を通していなかった（`og:verify` と内部リンク検査に
      # 至ってはどこからも走っていない）。npm ci 2 秒 + build 3.5 秒なので
      # ここで通す。**Rust より前に置く**のは、docs の壊れがビルド 40 分の
      # 後ろに隠れないようにするため（#1547）
      - name: docs をビルド（robots.txt の同梱まで見る。#1547）
        working-directory: docs
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/robots.txt
      # OG / Twitter Card（ページごとの固有画像・自ページを指す og:url）。
      # 焼き忘れると SNS で全ページがトップの画像になる
      - name: docs の OG 画像を検査（#1547）
        working-directory: docs
        run: npm run og:verify
      # 内部リンクと断片（`/agent-support/#...`）。生成ページは件数で見出しが
      # 変わるので、手書きページからのアンカーが静かに切れる（#1547）
      - name: docs の内部リンクを検査（#1547）
        working-directory: docs
        run: node scripts/verify-links.mjs
      # docs と能力マトリクスが「追跡先」として貼る Issue が open か。
      # 閉じた Issue を指したままだと、読む側が残りの仕事を辿れなくなる
      # （#1547 の棚卸しでは docs の Issue 参照 17 件のうち 10 件が closed だった）
      - name: 追跡先の Issue が閉じていない（#1547）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-docs-issue-refs.sh
      # rust-toolchain.toml と同じバージョンをピン（git 版 gpui が新しめの stable を要求）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: フォーマット検査
        run: cargo fmt --all --check
      - name: Clippy（warning をエラー扱い）
        run: cargo clippy --workspace --all-targets -- -D warnings
      # visual-test（実ピクセル検査）は品質ゲートの 1 本だが、feature の内側は
      # 上の `--all-targets` には出てこない。#1041 の API 変更へ visual-test 節が
      # 追従せず **main が `--features visual-test` でビルドできない**状態のまま
      # 素通りした（#1072）ので、feature を有効にした型検査もここで 1 回通す。
      # 増える単位は gpui_platform / gpui_macos / tako-app の 3 つだけ
      # （feature が違うのはこの経路だけで、残りの依存はそのまま再利用される）
      - name: Clippy（visual-test feature。#1072）
        run: cargo clippy -p tako-app --features visual-test --all-targets -- -D warnings
      # 上の `--workspace` 形は **全メンバーの feature を統合した 1 つの宇宙**しか見ない。
      # gpui（zed 由来）が `serde_json/preserve_order` を要求するので、workspace 形では
      # `serde_json::Map` が IndexMap 実装になり `Value` が**有意な Drop** を持つ
      # → clippy の `unnecessary_lazy_evaluations` は `then_some` を提案しなくなる。
      # 一方 GUI を含まない `-p tako-control` の宇宙では Map は BTreeMap 実装（Drop は
      # insignificant）なので同じ行に lint が出る。**CI 緑なのに手元の `-p` が赤**という
      # 食い違いがこれで生まれた（#1383。実測は .agent/commands.md の lint 行）。
      # そこで **gpui を含まない宇宙**を 1 回だけ別に lint する。tako-app 側の宇宙は
      # 上の 2 ステップが既に見ているので、足すのはこの 3 クレートだけでよい
      - name: Clippy（gpui 抜きの feature 宇宙。#1383）
        run: cargo clippy -p tako-core -p tako-control -p tako-cli --all-targets -- -D warnings
      - name: ビルド
        run: cargo build --workspace
      - name: テスト
        run: cargo test --workspace
      # 対応マトリクス（support.rs）から生成している docs ページが古いまま
      # コミットされるのを止める。宣言は system prompt にも流れるので
      # 「docs だけ古い」を許すと利用者と AI で見えている事実が食い違う（#591 / #516）
      - name: Windows 対応状況ページがマトリクスと同期している
        run: node scripts/gen-windows-support-docs.mjs --check
      - name: エージェント対応状況ページがマトリクスと同期している
        run: node scripts/gen-agent-support-docs.mjs --check
      # 上の 2 つが「どの tako を使うか」を間違えないことの検査。以前は
      # target/debug → target/release の順に**存在する方**を返すだけだったので、
      # debug だけ古い開発ツリーでは偽の赤と docs の静かな巻き戻しが起きた（#1548）。
      # 版の突き合わせ・TAKO_BIN・実装 1 か所が壊れたらここで落ちる
      - name: docs 生成が選ぶ tako バイナリのテスト
        run: bash scripts/test-gen-docs-bin-1548.sh
      # リリースノートのページが現行の版から取り残されるのを止める。v0.8.0 が出てから
      # 25 日間、ページの見出しは「v0.7.0（2026-08-15）— 最新の安定版」のままだった
      # （#1546）。「最新の安定版」= GitHub Releases で Latest が付く版なので、夜間の
      # テスト版（prerelease）が進んでもラベルは動かさない。現行の版は Cargo.toml /
      # CHANGELOG / git tag の最大値から採る（checkout はタグを持たないので Cargo.toml が主）
      - name: リリースノートのページが現行の版に追いついている
        run: node docs/scripts/check-releases-page.mjs
      # リリース経路（gh release create のリトライ / 両 OS の待ち合わせ / 片肺の検出）の
      # モックテスト。ダミー gh を PATH に挿すので本番の Release には触らない。
      # **片肺リリースの検出が壊れたらここで落ちる**（#256 / #965）
      - name: リリース経路のモックテスト
        run: bash scripts/test-release-retry.sh
      # 夜間リリースの版数決定（予約 / patch bump）と**共有ツリーの不変条件**の
      # モックテスト。一時ディレクトリの origin + 作業リポで実物の nightly-release.sh を
      # 走らせ、release.sh はスタブ・HOME も隔離するので本番のタグ / Release / 予約 /
      # launchd には触らない。**リリース後に共有ツリーが detached のまま残る形へ
      # 戻ったらここで落ちる**（#1005 / #1136）
      - name: 夜間リリースのモックテスト
        run: bash scripts/test-nightly-reserve.sh
      # .app の差し替え（置き場のパスを一度も空けない）のモックテスト。一時ディレクトリの
      # dummy .app だけを相手にするので本番の /Applications には触らない。
      # **Dock のピンが逃げる形へ戻ったらここで落ちる**（#1042）
      - name: バンドル差し替えのモックテスト
        run: bash scripts/test-bundle-install.sh
      # 仮想ディスプレイの見張り（同名の増殖で止まる / Main を仮想のままにしない /
      # 孤児の後片付けは実行条件を満たすまで拒否する）のモックテスト。画面の列挙・器の
      # CLI・蓋の状態をすべてスタブするので、画面の無いランナーでも走り実機には触らない。
      # **器を再起動してよい条件の判定が壊れたらここで落ちる**（#1150）
      - name: 仮想ディスプレイの見張りのモックテスト
        run: bash scripts/test-virtual-display-guard.sh
      # テスト由来の事前信頼エントリを掃除するスクリプトのモックテスト。偽の HOME に
      # 作った .claude.json だけを相手にするので本番の ~/.claude.json には触らない。
      # **実プロジェクトを巻き添えで消す形へ変わったらここで落ちる**（#1030 / #1022）
      - name: 事前信頼の残骸掃除のモックテスト
        run: bash scripts/test-clean-trust-residue.sh
      # `tako setup` の依存チェック段（未検出の CLI 依存を [y/N] で導入まで通す）の
      # 実経路テスト。隔離 HOME / TAKO_DATA_DIR / PATH + brew と claude のスタブなので
      # 本番の設定にも実機の tmux にも触らない。**標準 `tako setup` が「検出はするが
      # 入れない」へ戻ったらここで落ちる**（#1499。#1057 は `--review` だけの復活で、
      # 実機の利用者には検出止まりに見えていた）
      - name: setup の依存導入の実経路テスト
        run: bash scripts/test-setup-deps-prompt-1499.sh
      # 未認証・未導入でも `tako setup` が全段やって exit 0 し、「残り」を最簡コマンド
      # つきで出すことの実経路テスト。隔離 HOME / TAKO_DATA_DIR / PATH + claude / codex /
      # brew / curl のスタブなので本番の設定にもネットワークにも触らない。
      # **詰まった段で exit 1 して残りの段を捨てる形へ戻ったらここで落ちる**
      # （#1501。#1500 の棚卸しでは新品環境で「setup を走らせても何も整わない」だった）
      - name: setup が詰まっても完走することの実経路テスト
        run: bash scripts/test-setup-continue-1501.sh
      # 無応答の claude（`claude mcp list` が返らない）を掴んでも `tako setup` が
      # 上限で打ち切って完走することの実経路テスト。隔離 HOME / TAKO_DATA_DIR / PATH +
      # claude / brew のスタブで、立てた人工プロセスは自分の pid だけ片付ける。
      # **probe や dispatch の待ちから上限が消えたらここで落ちる**（#1503。#1500 の
      # 棚卸し R4 では `tako setup` が無言で 6 分固まり続けた）
      - name: setup の probe が上限で打ち切ることの実経路テスト
        run: bash scripts/test-setup-probe-timeout-1503.sh
      # シェル統合（OSC 7 / 133・cwd 追従・入力予測）を `tako setup` の段として配置する
      # ことの実経路テスト。隔離 HOME / TAKO_DATA_DIR / PATH + claude / tmux / git /
      # tailscale のスタブなので本番の rc にも `$PROFILE` にも触らない（unix ではそもそも
      # ユーザーのファイルを 1 バイトも書かないことを毎回確かめる）。Windows 形（`$PROFILE`
      # へブロックを置く経路）の表示・冪等・残りは `Status` を組んで macOS 上で通す。
      # **配置が `tako shell-integration install` を人が打つまで走らない形へ戻ったら
      # ここで落ちる**（#1504。#1500 の棚卸し Z9 = Windows は人が打つまで cwd 追従が死ぬ）
      - name: setup がシェル統合を配置することの実経路テスト
        run: bash scripts/test-setup-shell-integration-1504.sh
      # `tako remote setup` の [1/5]（未導入の Tailscale をその場で入れる）の実経路テスト。
      # 隔離 HOME / TAKO_DATA_DIR / PATH + brew スタブで、`TAKO_TAILSCALE_BIN` を
      # 隔離 PATH の中へ向けて「未導入」を作るので実機の Tailscale にも tailnet の
      # serve 設定にも触らない（スタブ tailscale は NeedsLogin を返すので [2/5] で止まる）。
      # **導入が `setup_deps` を通らない形（brew の直叩き）へ戻ったらここで落ちる**（#1509）
      - name: remote setup の依存導入の実経路テスト
        run: bash scripts/test-remote-setup-deps-1509.sh
      # PR の CI 完了待ちのモックテスト。偽 gh を PATH に挿し、一時ディレクトリの偽リポジトリ
      # （.github/workflows つき）だけを相手にするので本番の PR には触らない。
      # **「出ているチェックが全部 pending でなければ完了」へ戻ったらここで落ちる**
      # （push 直後は Cloudflare Pages しか登録されておらず、そこで merge すると
      # CI 完了前 merge になる = #1313 / #1253 / #1282。判定の正は
      # scripts/wait-pr-checks.sh の 1 実装で、master / worker もこれを呼ぶ = #1333）
      - name: CI 完了待ちのモックテスト
        run: bash scripts/test-wait-pr-checks.sh
      # PWA の Playwright e2e（6 spec / 50 項目）。**この e2e は CI で 1 度も走っておらず、
      # 走らせ方もどこにも書かれていなかった**ので、#425 の契約変更（承認カードを
      # transcript 推定 → permission_dialog 実在へ / 送信先を /input → /respond へ）で
      # spec が取り残されたまま 6 週間誰も気づかず、同じ症状が #1089 として独立に
      # 再起票された（#632 / #1357）。**PWA の実装契約が spec とズレたらここで落ちる**。
      # node_modules は上の「PWA をビルド」の npm ci をそのまま使い、ブラウザは
      # chromium だけ（config の projects も chromium 1 本・headless 固定）。
      # 手順とローカルでの回し方は web/tako-remote/README.md
      - name: PWA e2e のブラウザを取得（#1357）
        working-directory: web/tako-remote
        run: npm run e2e:install
      - name: PWA e2e（Playwright 6 spec / 50 項目。#1357）
        working-directory: web/tako-remote
        run: npm run e2e

  windows:
    name: Windows（build + test スモーク）
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # gpui の Windows ビルドは Spectre-mitigated libs が前提（無いとリンクエラー）。
      # ランナーの VS には既定で入っていないため VS インストーラーで追加する
      - name: Spectre-mitigated libs をインストール
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS installation: $vsPath"
          $process = Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" `
            -ArgumentList "modify", "--installPath", "`"$vsPath`"", `
              "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", `
              "--quiet", "--norestart", "--nocache" `
            -Wait -PassThru
          # 3010 = 成功（要再起動）。ランナーでは再起動不要
          if (($process.ExitCode -ne 0) -and ($process.ExitCode -ne 3010)) {
            Write-Error "VS インストーラーが終了コード $($process.ExitCode) で失敗"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tako-remote/package-lock.json
      # macOS ジョブと同じ理由（Issue #574）。bash 指定は pwsh の `&&` が
      # 最後のコマンドの終了コードしか見ないため（npm ci の失敗を握り潰さない）
      - name: PWA をビルド（rust_embed が dist/ を要求する）
        shell: bash
        working-directory: web/tako-remote
        run: npm ci --no-audit --no-fund && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: ビルド
        run: cargo build --workspace
      # **テストの「コンパイル」だけは blocking** にする（#1264）。
      # 上の `cargo build --workspace` は `tests/` のターゲットをコンパイルしないので、
      # Windows 専用の統合テスト（`#![cfg(windows)]` = macOS では空クレート）が
      # 壊れても両ジョブが緑のまま通る。実際に main が「テストが 1 件も走らない」
      # 状態で放置された（#1264。#1199 の検証ブロックが変数の無い関数に入り E0425 × 3）。
      # テスト結果の非ブロッキング（#583）は据え置いたまま、コンパイル可能性だけを守る。
      # **追加の所要時間は実質ゼロ**: 下のテスト実行はここで作ったテストバイナリを
      # そのまま使う（実機実測: `--no-run` の後の `cargo test --workspace` は再コンパイル 0）
      - name: テストのコンパイル検査（#1264。結果ではなくビルドを守る）
        run: cargo test --workspace --no-run
      # #1282: 器の列挙が使う Win32 FFI（`NtQueryInformationProcess` でのコマンドライン /
      # `GetProcessTimes` での起動時刻）は **macOS では 1 行も実行できない**。
      # 全数（下のステップ）より**手前に名指しで置く**のは、そこが赤いと
      # 以降のステップが skip されて「FFI が通ったのか」が読めなくなるため。
      # テストバイナリは上のステップで作ってあるので追加の所要は数秒
      - name: Windows FFI の実行検査（#1282。プロセスのコマンドライン / 起動時刻）
        run: cargo test -p tako-core --lib platform::procinfo
      # #1314: psmux は **Windows でしか動かない器**。conf の差し替えは NTFS の rename
      # 意味論（開かれている置換先・`FILE_SHARE_DELETE`）に依存するので、
      # この器のテストも**全数より手前**に名指しで置く（#1282 と同じ理由）。
      # テストバイナリは上のステップで作ってあるので追加の所要は数秒
      - name: psmux バックエンドの実行検査（#1314。conf の原子的な差し替えを含む）
        run: cargo test -p tako-core --lib backend::psmux
      # **ワークスペース全体のテストを blocking にする**（#1278 / #583）。
      # #583 は「POSIX 前提の既存失敗が残っているあいだ非ブロッキング」で据え置いていたが、
      # そのあいだに未検出が溜まり、実機で 19 → 24 件まで増えていた（#1278）。
      # テスト側の前提を直し、Windows に存在しない仕組みを見るものだけを
      # **理由つきで名指し skip** へ寄せたので、ここを結果まで blocking にする。
      #
      # `--no-fail-fast` が要る: 既定の cargo は最初に失敗したテストバイナリで打ち切るので、
      # 1 件目の失敗の先にあるクレートが 1 件も走らない（実測 2026-09-22 の main:
      # tako-app の 1 件で止まり、tako-control / tako-core は 0 件実行）。
      # これでは「直したら次が出る」を 1 PR 1 往復でしか進められない
      - name: テスト（#1278 で blocking 化。全数を採るため --no-fail-fast）
        run: cargo test --workspace --no-fail-fast
