# CI — macOS / Windows でビルド + lint + テスト
#
# Windows ジョブは Phase 0 残タスク「windows ランナーでの PoC 相当ビルド・スモーク」を兼ねる
# （実機が無いため CI が唯一の Windows 検証手段。.agent/roadmap.md Phase 1）。
# gpui の Windows ビルド前提（Spectre-mitigated libs 等）は .agent/architecture.md を参照。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI ではインクリメンタルビルド不要（キャッシュ効率優先）
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    name: macOS（build + lint + test）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tako-remote/package-lock.json
      # rust_embed が web/tako-remote/dist/ をコンパイル時に埋め込むため、
      # cargo の全ステップ（clippy 含む）より前に PWA をビルドする必要がある。
      # dist/ は .gitignore 対象なのでクリーンチェックアウトには存在しない（Issue #574）。
      # 手順は scripts/build-app.sh の「PWA ビルド」節と同じ
      - name: PWA をビルド（rust_embed が dist/ を要求する）
        working-directory: web/tako-remote
        run: npm ci --no-audit --no-fund && npm run build
      # rust-toolchain.toml と同じバージョンをピン（git 版 gpui が新しめの stable を要求）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: フォーマット検査
        run: cargo fmt --all --check
      - name: Clippy（warning をエラー扱い）
        run: cargo clippy --workspace --all-targets -- -D warnings
      # visual-test（実ピクセル検査）は品質ゲートの 1 本だが、feature の内側は
      # 上の `--all-targets` には出てこない。#1041 の API 変更へ visual-test 節が
      # 追従せず **main が `--features visual-test` でビルドできない**状態のまま
      # 素通りした（#1072）ので、feature を有効にした型検査もここで 1 回通す。
      # 増える単位は gpui_platform / gpui_macos / tako-app の 3 つだけ
      # （feature が違うのはこの経路だけで、残りの依存はそのまま再利用される）
      - name: Clippy（visual-test feature。#1072）
        run: cargo clippy -p tako-app --features visual-test --all-targets -- -D warnings
      - name: ビルド
        run: cargo build --workspace
      - name: テスト
        run: cargo test --workspace
      # 対応マトリクス（support.rs）から生成している docs ページが古いまま
      # コミットされるのを止める。宣言は system prompt にも流れるので
      # 「docs だけ古い」を許すと利用者と AI で見えている事実が食い違う（#591 / #516）
      - name: Windows 対応状況ページがマトリクスと同期している
        run: node scripts/gen-windows-support-docs.mjs --check
      - name: エージェント対応状況ページがマトリクスと同期している
        run: node scripts/gen-agent-support-docs.mjs --check
      # リリース経路（gh release create のリトライ / 両 OS の待ち合わせ / 片肺の検出）の
      # モックテスト。ダミー gh を PATH に挿すので本番の Release には触らない。
      # **片肺リリースの検出が壊れたらここで落ちる**（#256 / #965）
      - name: リリース経路のモックテスト
        run: bash scripts/test-release-retry.sh
      # 夜間リリースの版数決定（予約 / patch bump）と**共有ツリーの不変条件**の
      # モックテスト。一時ディレクトリの origin + 作業リポで実物の nightly-release.sh を
      # 走らせ、release.sh はスタブ・HOME も隔離するので本番のタグ / Release / 予約 /
      # launchd には触らない。**リリース後に共有ツリーが detached のまま残る形へ
      # 戻ったらここで落ちる**（#1005 / #1136）
      - name: 夜間リリースのモックテスト
        run: bash scripts/test-nightly-reserve.sh
      # .app の差し替え（置き場のパスを一度も空けない）のモックテスト。一時ディレクトリの
      # dummy .app だけを相手にするので本番の /Applications には触らない。
      # **Dock のピンが逃げる形へ戻ったらここで落ちる**（#1042）
      - name: バンドル差し替えのモックテスト
        run: bash scripts/test-bundle-install.sh
      # 仮想ディスプレイの見張り（同名の増殖で止まる / Main を仮想のままにしない /
      # 孤児の後片付けは実行条件を満たすまで拒否する）のモックテスト。画面の列挙・器の
      # CLI・蓋の状態をすべてスタブするので、画面の無いランナーでも走り実機には触らない。
      # **器を再起動してよい条件の判定が壊れたらここで落ちる**（#1150）
      - name: 仮想ディスプレイの見張りのモックテスト
        run: bash scripts/test-virtual-display-guard.sh
      # テスト由来の事前信頼エントリを掃除するスクリプトのモックテスト。偽の HOME に
      # 作った .claude.json だけを相手にするので本番の ~/.claude.json には触らない。
      # **実プロジェクトを巻き添えで消す形へ変わったらここで落ちる**（#1030 / #1022）
      - name: 事前信頼の残骸掃除のモックテスト
        run: bash scripts/test-clean-trust-residue.sh
      # PR の CI 完了待ちのモックテスト。偽 gh を PATH に挿し、一時ディレクトリの偽リポジトリ
      # （.github/workflows つき）だけを相手にするので本番の PR には触らない。
      # **「出ているチェックが全部 pending でなければ完了」へ戻ったらここで落ちる**
      # （push 直後は Cloudflare Pages しか登録されておらず、そこで merge すると
      # CI 完了前 merge になる = #1313 / #1253 / #1282。判定の正は
      # scripts/wait-pr-checks.sh の 1 実装で、master / worker もこれを呼ぶ = #1333）
      - name: CI 完了待ちのモックテスト
        run: bash scripts/test-wait-pr-checks.sh
      # PWA の Playwright e2e（6 spec / 50 項目）。**この e2e は CI で 1 度も走っておらず、
      # 走らせ方もどこにも書かれていなかった**ので、#425 の契約変更（承認カードを
      # transcript 推定 → permission_dialog 実在へ / 送信先を /input → /respond へ）で
      # spec が取り残されたまま 6 週間誰も気づかず、同じ症状が #1089 として独立に
      # 再起票された（#632 / #1357）。**PWA の実装契約が spec とズレたらここで落ちる**。
      # node_modules は上の「PWA をビルド」の npm ci をそのまま使い、ブラウザは
      # chromium だけ（config の projects も chromium 1 本・headless 固定）。
      # 手順とローカルでの回し方は web/tako-remote/README.md
      - name: PWA e2e のブラウザを取得（#1357）
        working-directory: web/tako-remote
        run: npm run e2e:install
      - name: PWA e2e（Playwright 6 spec / 50 項目。#1357）
        working-directory: web/tako-remote
        run: npm run e2e

  windows:
    name: Windows（build + test スモーク）
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # gpui の Windows ビルドは Spectre-mitigated libs が前提（無いとリンクエラー）。
      # ランナーの VS には既定で入っていないため VS インストーラーで追加する
      - name: Spectre-mitigated libs をインストール
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS installation: $vsPath"
          $process = Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" `
            -ArgumentList "modify", "--installPath", "`"$vsPath`"", `
              "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", `
              "--quiet", "--norestart", "--nocache" `
            -Wait -PassThru
          # 3010 = 成功（要再起動）。ランナーでは再起動不要
          if (($process.ExitCode -ne 0) -and ($process.ExitCode -ne 3010)) {
            Write-Error "VS インストーラーが終了コード $($process.ExitCode) で失敗"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tako-remote/package-lock.json
      # macOS ジョブと同じ理由（Issue #574）。bash 指定は pwsh の `&&` が
      # 最後のコマンドの終了コードしか見ないため（npm ci の失敗を握り潰さない）
      - name: PWA をビルド（rust_embed が dist/ を要求する）
        shell: bash
        working-directory: web/tako-remote
        run: npm ci --no-audit --no-fund && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: ビルド
        run: cargo build --workspace
      # **テストの「コンパイル」だけは blocking** にする（#1264）。
      # 上の `cargo build --workspace` は `tests/` のターゲットをコンパイルしないので、
      # Windows 専用の統合テスト（`#![cfg(windows)]` = macOS では空クレート）が
      # 壊れても両ジョブが緑のまま通る。実際に main が「テストが 1 件も走らない」
      # 状態で放置された（#1264。#1199 の検証ブロックが変数の無い関数に入り E0425 × 3）。
      # テスト結果の非ブロッキング（#583）は据え置いたまま、コンパイル可能性だけを守る。
      # **追加の所要時間は実質ゼロ**: 下のテスト実行はここで作ったテストバイナリを
      # そのまま使う（実機実測: `--no-run` の後の `cargo test --workspace` は再コンパイル 0）
      - name: テストのコンパイル検査（#1264。結果ではなくビルドを守る）
        run: cargo test --workspace --no-run
      # Windows のテストは #574 でビルドが通るようになって初めて実行され、POSIX 前提の
      # 既存テスト 18 件（ps / symlink / `~` 展開 / sh 前提の spawn 等）が落ちている。
      # 内訳と対応は Issue #583（#467 Windows 移植の子タスク）。
      # **#583 が片付くまで Windows のテストは非ブロッキング**にする。ビルドは
      # blocking のまま（このジョブの主目的は Windows ビルドスモークのため）
      - name: テスト（#583 が片付くまで非ブロッキング）
        continue-on-error: true
        run: cargo test --workspace
      # #1282: 器の列挙が使う Win32 FFI（`NtQueryInformationProcess` でのコマンドライン /
      # `GetProcessTimes` での起動時刻）は **macOS では 1 行も実行できない**。
      # 上の `cargo test --workspace` は tako-app の既知失敗（#583）でそこで打ち切られ、
      # tako-core まで届かない（実測 2026-09-11: 622 passed / 1 failed で終了 = 以降のクレートは未実行）。
      # そこで FFI を実際に叩く検査だけ名指しで走らせ、**ここは blocking にする**
      # （構造体レイアウトの転記ミス・情報クラス番号・FILETIME の起点は他で捕まらない）。
      # テストバイナリは上のステップで作ってあるので追加の所要は数秒
      - name: Windows FFI の実行検査（#1282。プロセスのコマンドライン / 起動時刻）
        run: cargo test -p tako-core --lib platform::procinfo
      # #1314: psmux は **Windows でしか動かない器**なのに、上の `cargo test --workspace` は
      # 非ブロッキングかつ tako-app の既知失敗（#583）でそこで打ち切られるため、
      # tako-core のテストは Windows で 1 件も走っていない（#1282 と同じ状況）。
      # conf の差し替えは NTFS の rename 意味論（開かれている置換先・`FILE_SHARE_DELETE`）に
      # 依存するので、**この器のテストだけは Windows でも実際に走らせて blocking にする**。
      # テストバイナリは上のステップで作ってあるので追加の所要は数秒
      - name: psmux バックエンドの実行検査（#1314。conf の原子的な差し替えを含む）
        run: cargo test -p tako-core --lib backend::psmux
