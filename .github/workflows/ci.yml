# CI — macOS / Windows でビルド + lint + テスト
#
# Windows ジョブは Phase 0 残タスク「windows ランナーでの PoC 相当ビルド・スモーク」を兼ねる
# （実機が無いため CI が唯一の Windows 検証手段。.agent/roadmap.md Phase 1）。
# gpui の Windows ビルド前提（Spectre-mitigated libs 等）は .agent/architecture.md を参照。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI ではインクリメンタルビルド不要（キャッシュ効率優先）
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    name: macOS（build + lint + test）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tako-remote/package-lock.json
      # rust_embed が web/tako-remote/dist/ をコンパイル時に埋め込むため、
      # cargo の全ステップ（clippy 含む）より前に PWA をビルドする必要がある。
      # dist/ は .gitignore 対象なのでクリーンチェックアウトには存在しない（Issue #574）。
      # 手順は scripts/build-app.sh の「PWA ビルド」節と同じ
      - name: PWA をビルド（rust_embed が dist/ を要求する）
        working-directory: web/tako-remote
        run: npm ci --no-audit --no-fund && npm run build
      # rust-toolchain.toml と同じバージョンをピン（git 版 gpui が新しめの stable を要求）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: フォーマット検査
        run: cargo fmt --all --check
      - name: Clippy（warning をエラー扱い）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ビルド
        run: cargo build --workspace
      - name: テスト
        run: cargo test --workspace
      # 対応マトリクス（support.rs）から生成している docs ページが古いまま
      # コミットされるのを止める。宣言は system prompt にも流れるので
      # 「docs だけ古い」を許すと利用者と AI で見えている事実が食い違う（#591 / #516）
      - name: Windows 対応状況ページがマトリクスと同期している
        run: node scripts/gen-windows-support-docs.mjs --check
      - name: エージェント対応状況ページがマトリクスと同期している
        run: node scripts/gen-agent-support-docs.mjs --check

  windows:
    name: Windows（build + test スモーク）
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # gpui の Windows ビルドは Spectre-mitigated libs が前提（無いとリンクエラー）。
      # ランナーの VS には既定で入っていないため VS インストーラーで追加する
      - name: Spectre-mitigated libs をインストール
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS installation: $vsPath"
          $process = Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" `
            -ArgumentList "modify", "--installPath", "`"$vsPath`"", `
              "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", `
              "--quiet", "--norestart", "--nocache" `
            -Wait -PassThru
          # 3010 = 成功（要再起動）。ランナーでは再起動不要
          if (($process.ExitCode -ne 0) -and ($process.ExitCode -ne 3010)) {
            Write-Error "VS インストーラーが終了コード $($process.ExitCode) で失敗"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tako-remote/package-lock.json
      # macOS ジョブと同じ理由（Issue #574）。bash 指定は pwsh の `&&` が
      # 最後のコマンドの終了コードしか見ないため（npm ci の失敗を握り潰さない）
      - name: PWA をビルド（rust_embed が dist/ を要求する）
        shell: bash
        working-directory: web/tako-remote
        run: npm ci --no-audit --no-fund && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: ビルド
        run: cargo build --workspace
      # Windows のテストは #574 でビルドが通るようになって初めて実行され、POSIX 前提の
      # 既存テスト 18 件（ps / symlink / `~` 展開 / sh 前提の spawn 等）が落ちている。
      # 内訳と対応は Issue #583（#467 Windows 移植の子タスク）。
      # **#583 が片付くまで Windows のテストは非ブロッキング**にする。ビルドは
      # blocking のまま（このジョブの主目的は Windows ビルドスモークのため）
      - name: テスト（#583 が片付くまで非ブロッキング）
        continue-on-error: true
        run: cargo test --workspace
