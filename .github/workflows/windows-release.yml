# Windows リリース — release ビルド → Inno Setup → Release へアセット添付
#
# 生成するアセット（命名規約は変更しない）:
#   tako-setup-{tag}-x64.exe      インストーラー（per-user・PATH 追加あり）
#   tako-{tag}-windows-x64.zip    ポータブル版
#
# ビルド手順そのものは installer/windows/build-installer.ps1 に置いてある。
# ローカルと CI で同じ経路を通すため、ここではその呼び出しに徹する。
#
# 注意: 対象タグの Release が無ければこのワークフローが作る。macOS 側の
# scripts/release.sh も Release を作るので、両方を回すときは release.sh を先に流すこと
# （後発は「既にある」と判断してアップロードだけ行う）。
name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ（例: v0.6.0）。既に push 済みのタグを指定する"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Windows 配布物のビルドと添付
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # タグは式展開でシェルへ直接埋めず env 経由で渡す（コマンド注入を避ける）
      - name: タグを決める
        id: meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$') {
            throw "タグの形式が不正: $tag（期待: v0.6.0 / v0.6.0-rc1）"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "tag = $tag"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}

      # gpui の Windows ビルドは Spectre-mitigated libs が前提（無いとリンクエラー）。
      # ランナーの VS には既定で入っていないため VS インストーラーで追加する（ci.yml と同じ）
      - name: Spectre-mitigated libs をインストール
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS installation: $vsPath"
          $process = Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" `
            -ArgumentList "modify", "--installPath", "`"$vsPath`"", `
              "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", `
              "--quiet", "--norestart", "--nocache" `
            -Wait -PassThru
          # 3010 = 成功（要再起動）。ランナーでは再起動不要
          if (($process.ExitCode -ne 0) -and ($process.ExitCode -ne 3010)) {
            Write-Error "VS インストーラーが終了コード $($process.ExitCode) で失敗"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2

      # tako.iss の ArchitecturesAllowed=x64compatible は Inno Setup 6.3 以上が要る。
      # ランナー同梱版が古いことがあるので upgrade で最新へ揃える（未導入なら install される）。
      # ISCC.exe はバージョンリソースを持たないため、事前のバージョン判定はできない
      - name: Inno Setup を用意
        id: iscc
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup の導入に失敗: $iscc が無い" }
          "path=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "ISCC: $iscc"

      # 実際のコンパイラ版数は ISCC のログ（Compiler engine version: ...）に出る
      - name: 配布物をビルド
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ISCC_PATH: ${{ steps.iscc.outputs.path }}
        # ISCC のパスには空白が含まれるので明示的に括る
        run: pwsh -File installer/windows/build-installer.ps1 -Version "$env:TAG" -IsccPath "$env:ISCC_PATH"

      - name: 生成物を確認
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $expected = @("dist/windows/tako-setup-$env:TAG-x64.exe", "dist/windows/tako-$env:TAG-windows-x64.zip")
          foreach ($f in $expected) {
            if (-not (Test-Path -LiteralPath $f)) { throw "生成物が無い: $f" }
            "{0,-44} {1,12:N0} bytes" -f (Split-Path -Leaf $f), (Get-Item -LiteralPath $f).Length
          }

      - uses: actions/upload-artifact@v4
        with:
          name: tako-windows-${{ steps.meta.outputs.tag }}
          path: dist/windows/*
          if-no-files-found: error

      - name: Release へアップロード
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # gh の非ゼロ終了で例外にしたくない箇所があるので明示的に緩める
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          gh release view $env:TAG 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $env:TAG が無いので作成する"
            gh release create $env:TAG --title $env:TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create に失敗" }
          } else {
            Write-Host "Release $env:TAG は既にある。アセットのみ追加する"
          }

          $assets = @(
            "dist/windows/tako-setup-$env:TAG-x64.exe",
            "dist/windows/tako-$env:TAG-windows-x64.zip"
          )
          gh release upload $env:TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload に失敗" }
