# 一時: #2433 の winget の実測（PR を出す前に消す）
name: measure-winget-2433
on:
  push:
    branches: [feat/2433-winget-deps]
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: winget の実測
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Code($c) { if ($null -eq $c) { return 'null' }; '{0} (0x{0:X8})' -f [int]$c }
          Write-Output '== 権限と UAC'
          whoami
          $p = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Output ('admin=' + $p.IsInRole([Security.Principal.WindowsBuiltInRole]'Administrator'))
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' | Select-Object EnableLUA, ConsentPromptBehaviorAdmin | Format-List
          Write-Output '== winget の場所'
          Get-Command winget -All -ErrorAction SilentlyContinue | Format-List Source, CommandType
          $w = (Get-Command winget -ErrorAction SilentlyContinue).Source
          if ($w) { Get-Item $w -Force | Format-List FullName, Attributes, LinkType, Length; Write-Output ('Test-Path Leaf=' + (Test-Path -LiteralPath $w -PathType Leaf)) }
          winget --version; Write-Output ('exit=' + (Code $LASTEXITCODE))
          winget --info
          winget source list
          Write-Output '== user Path（前）'
          [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Output '== psmux（前）'
          Get-Command psmux, pmux -ErrorAction SilentlyContinue | Format-List Source
          Write-Output '== show psmux'
          winget show --id marlocarlo.psmux --exact --source winget --accept-source-agreements --disable-interactivity
          Write-Output ('exit=' + (Code $LASTEXITCODE))
          Write-Output '== install psmux --scope user（stdin なし・非対話）'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $args1 = @('install','--id','marlocarlo.psmux','--exact','--source','winget','--scope','user','--silent','--disable-interactivity','--accept-source-agreements','--accept-package-agreements')
          $out = & winget @args1 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 15
          Write-Output ('exit=' + (Code $c) + ' secs=' + [int]$sw.Elapsed.TotalSeconds)
          Write-Output '== user Path（後）'
          [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Output '== Links'
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Links" -Force -ErrorAction SilentlyContinue | Format-Table Name, LinkType, Target -AutoSize
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -ErrorAction SilentlyContinue | Select-Object Name
          Write-Output '== process の PATH で psmux は引けるか'
          Get-Command psmux -ErrorAction SilentlyContinue | Format-List Source
          Write-Output '== 2 回目（導入済み）'
          $out = & winget @args1 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 8
          Write-Output ('exit=' + (Code $c))
          Write-Output '== 2 回目（--scope 無し）'
          $out = & winget install --id marlocarlo.psmux --exact --source winget --silent --disable-interactivity --accept-source-agreements --accept-package-agreements 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 8
          Write-Output ('exit=' + (Code $c))
          Write-Output '== 無い id'
          $out = & winget install --id tako.nonexistent.pkg2433 --exact --source winget --silent --disable-interactivity --accept-source-agreements --accept-package-agreements 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 5
          Write-Output ('exit=' + (Code $c))
          Write-Output '== 知らない引数（古い winget の代わり）'
          $out = & winget install --id marlocarlo.psmux --tako-unknown-flag 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 5
          Write-Output ('exit=' + (Code $c))
          Write-Output '== 取得元に届かない（--proxy で塞ぐ）'
          winget settings --enable ProxyCommandLineOptions
          Write-Output ('settings exit=' + (Code $LASTEXITCODE))
          $out = & winget install --id jqlang.jq --exact --source winget --scope user --silent --disable-interactivity --accept-source-agreements --accept-package-agreements --proxy http://127.0.0.1:9 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 8
          Write-Output ('exit=' + (Code $c))
          Write-Output '== Git（既に入っている）'
          Get-Command git -All | Format-List Source
          winget list --id Git.Git --exact --source winget --accept-source-agreements --disable-interactivity
          Write-Output ('list exit=' + (Code $LASTEXITCODE))
          winget show --id Git.Git --exact --source winget --disable-interactivity | Select-Object -First 30
          Write-Output '== Git の install（導入済み = 何が返るか）'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = & winget install --id Git.Git --exact --source winget --silent --disable-interactivity --accept-source-agreements --accept-package-agreements 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 12
          Write-Output ('exit=' + (Code $c) + ' secs=' + [int]$sw.Elapsed.TotalSeconds)
          Write-Output '== uninstall psmux'
          $out = & winget uninstall --id marlocarlo.psmux --exact --source winget --silent --disable-interactivity --accept-source-agreements 2>&1
          $c = $LASTEXITCODE
          $out | Select-Object -Last 5
          Write-Output ('exit=' + (Code $c))
          [Environment]::GetEnvironmentVariable('Path', 'User')
